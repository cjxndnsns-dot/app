async function fetchKeySecure(key) {
  var res = await fetch(FIREBASE_URL + "/keys/" + encodeURIComponent(key) + ".json", {
    method: 'GET', cache: 'no-store', headers: { 'Accept': 'application/json' }
  });
  if (!res.ok) throw new Error('network');
  var data = await res.json();
  if (!data) return null;
  if (data.sig) {
    var payload = Object.assign({}, data);
    var sig = payload.sig;
    delete payload.sig;
    if (!HMAC.verify(payload, sig)) throw new Error('signature');
  }
  return data;
}

async function activateKey(key) {
  try {
    var data = await fetchKeySecure(key);
    if (!data) return { success:false, message:'Key không tồn tại!' };
    if (data.platform && data.platform !== PLATFORM && data.platform !== 'both') {
      return { success:false, message:'❌ Key dành cho ' + data.platform.toUpperCase() + ', không dùng cho iOS!' };
    }
    if (data.expiry && data.expiry < Date.now()) {
      return { success:false, message:'Key đã hết hạn!', expired:true };
    }
    if (data.deviceLimit) {
      var devices = data.devices || [];

    if (!data.devices || !data.devices.includes(deviceId)) {

      data.devices = updated;
    }
    return { success:true, data:data };

    return { success:false, message:'Không kết nối được Firebase!' };
  }

function renderFeatures(keyLevel) {
  var container = document.getElementById('featureContainer');
  var levelNum = (KEY_LEVELS[keyLevel] || KEY_LEVELS.free).level;
  var groups = {};
  ALL_FEATURES.forEach(function(f){ (groups[f.level] = groups[f.level] || []).push(f); });
  var html = '';
  ['free','thuong','vip'].forEach(function(level) {
    if (!groups[level]) return;
    var isAllowed = KEY_LEVELS[level].level <= levelNum;
    html += '<div class="feature-group"><div class="group-header"><span>' + GROUP_NAMES[level] + '</span><span>' + (isAllowed ? '🔓' : '🔒') + '</span></div>';
    groups[level].forEach(function(f) {
      var lockClass = isAllowed ? '' : 'locked';
      var tagHtml = f.tag ? '<span class="vip-tag">' + f.tag + '</span>' : '';
      html += '<div class="feature-item" data-feature="' + f.id + '"><div class="icon">' + f.icon + '</div><div class="info"><b>' + f.name + ' ' + tagHtml + '</b><small>' + f.desc + '</small></div><div class="switch ' + lockClass + '" data-feature="' + f.id + '"></div></div>';
    });
    html += '</div>';
  });
  container.innerHTML = html;
  updateVipStats(keyLevel);
}

function updateVipStats(keyLevel) {
  var levelNum = (KEY_LEVELS[keyLevel] || KEY_LEVELS.free).level;
  document.getElementById('sensiDisplay').textContent = levelNum >= 3 ? 'x10.0' : 'x5.0';
  var activeCount = document.querySelectorAll('.feature-item .switch.active:not(.locked)').length;
  var total = document.querySelectorAll('.feature-item .switch:not(.locked)').length;
  document.getElementById('activePatches').textContent = activeCount + '/' + total;
}

async function checkKeyPeriodic() {
  if (!isLoggedIn || !currentKey) return;
  var result = await activateKey(currentKey);
  if (!result.success) { showToast(result.message); handleLogout(); }
}

async function handleLogin() {
  if (!_integrityOK) return;
  var key = document.getElementById('keyInput').value.trim();
  if (!key) { showToast('Nhập key iOS!'); return; }
  var msg = document.getElementById('loginMessage');
  msg.textContent = '⏳ Đang kiểm tra...';
  msg.className = 'message';
  var result = await activateKey(key);
  if (!result.success) {
    msg.textContent = '❌ ' + result.message;
    msg.className = 'message err';
    showToast('❌ ' + result.message);
    return;
  }
  currentKey = key; keyData = result.data; isLoggedIn = true;
  sessionNonce = randomNonce();
  SecureStore.set('key', key);
  var keyLevel = getKeyLevel(keyData);
  currentKeyType = keyLevel;
  document.getElementById('loginGate').style.display = 'none';
  document.getElementById('appMain').style.display = 'block';
  document.getElementById('keyDisplay').textContent = key.substring(0,8) + '...';
  document.getElementById('iosVersionDisplay').textContent = iosVersion || 'Không xác định';
  if (keyData.expiry) {
    var days = getDaysLeft(keyData.expiry);
    document.getElementById('expiryDisplay').textContent = days;
    document.getElementById('keyExpiryDisplay').textContent = '🔑 Còn: ' + days;
    document.getElementById('keyExpiryDisplay').style.display = 'block';
  } else {
    document.getElementById('expiryDisplay').textContent = 'vĩnh viễn';
    document.getElementById('keyExpiryDisplay').textContent = '🔑 Còn: vĩnh viễn';
    document.getElementById('keyExpiryDisplay').style.display = 'block';
  }
  var badge = document.getElementById('keyTypeBadge');
  var info = KEY_LEVELS[keyLevel] || KEY_LEVELS.free;
  badge.textContent = info.label;
  badge.className = 'type-badge ' + info.class;
  var devices = keyData.devices || [];
  document.getElementById('deviceCountDisplay').textContent = devices.length + '/' + (keyData.deviceLimit || '∞');
  msg.textContent = '✅ Đăng nhập thành công!';
  msg.className = 'message ok';
  showToast('✅ Đăng nhập thành công!');
  renderFeatures(keyLevel);
  if (expiryInterval) clearInterval(expiryInterval);
  if (keyData.expiry) {
    expiryInterval = setInterval(function() {
      var d = getDaysLeft(keyData.expiry);
      document.getElementById('expiryDisplay').textContent = d;
      document.getElementById('keyExpiryDisplay').textContent = '🔑 Còn: ' + d;
      if (d === 'ĐÃ HẾT HẠN') { clearInterval(expiryInterval); handleLogout(); }
    }, 1000);
  }
  if (checkInterval) clearInterval(checkInterval);
  checkInterval = setInterval(checkKeyPeriodic, 5000);
}

function handleLogout() {
  SecureStore.del('key');
  isLoggedIn = false; currentKey = ""; keyData = null; sessionNonce = null;
  if (checkInterval) clearInterval(checkInterval);
  if (expiryInterval) clearInterval(expiryInterval);
  document.getElementById('loginGate').style.display = 'grid';
  document.getElementById('appMain').style.display = 'none';
  document.getElementById('keyExpiryDisplay').style.display = 'none';
  document.getElementById('keyInput').value = '';
  showToast('🚪 Đã đăng xuất');
}

function openGame(version) {
  var schemes = { freefire:'freefireth://', freefiremax:'freefiremax://' };
  var scheme = schemes[version] || schemes.freefire;
  if (Bridge.call('openGame', { version: version, scheme: scheme, nonce: sessionNonce })) return;
  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = scheme;
  document.body.appendChild(iframe);
  window.location.href = scheme;
  setTimeout(function(){ iframe.remove(); }, 2000);
}

function activateAndOpen() {
  if (!isLoggedIn || !_integrityOK) { showToast('Chưa đăng nhập!'); return; }
  var selector = document.getElementById('ffSelector');
  selector.classList.toggle('show');
  if (selector.classList.contains('show')) {
    var active = selector.querySelector('.ff-btn.active');
    if (!active) return;
    var version = active.dataset.ff;
    SecureStore.set('ff', version);
    document.querySelectorAll('.feature-item .switch.active:not(.locked)').forEach(function(sw) {
      var id = sw.dataset.feature;
      if (id) {
        SecureStore.set('t_' + id, true);
        Bridge.call(id, { enabled: true, nonce: sessionNonce });
      }
    });
    updateVipStats(currentKeyType);
    showToast('✅ Đang mở ' + (version === 'freefire' ? 'Free Fire' : 'Free Fire Max'));
    selector.classList.remove('show');
    setTimeout(function(){ openGame(version); }, 500);
  }
}

document.addEventListener('DOMContentLoaded', function() {
  document.getElementById('iosVersionDisplay').textContent = iosVersion || 'Không xác định';

  var savedKey = SecureStore.get('key');
  if (savedKey) {
    activateKey(savedKey).then(function(result) {
      if (result.success) {
        currentKey = savedKey; keyData = result.data; isLoggedIn = true;
        sessionNonce = randomNonce();
        var keyLevel = getKeyLevel(keyData); currentKeyType = keyLevel;
        document.getElementById('loginGate').style.display = 'none';
        document.getElementById('appMain').style.display = 'block';
        document.getElementById('keyDisplay').textContent = savedKey.substring(0,8) + '...';
        document.getElementById('iosVersionDisplay').textContent = iosVersion || 'Không xác định';
        if (keyData.expiry) {
          var d = getDaysLeft(keyData.expiry);
          document.getElementById('expiryDisplay').textContent = d;
          document.getElementById('keyExpiryDisplay').textContent = '🔑 Còn: ' + d;
          document.getElementById('keyExpiryDisplay').style.display = 'block';
        } else {
          document.getElementById('expiryDisplay').textContent = 'vĩnh viễn';
          document.getElementById('keyExpiryDisplay').textContent = '🔑 Còn: vĩnh viễn';
          document.getElementById('keyExpiryDisplay').style.display = 'block';
        }
        var badge = document.getElementById('keyTypeBadge');
        var info = KEY_LEVELS[keyLevel] || KEY_LEVELS.free;
        badge.textContent = info.label; badge.className = 'type-badge ' + info.class;
        var devices = keyData.devices || [];
        document.getElementById('deviceCountDisplay').textContent = devices.length + '/' + (keyData.deviceLimit || '∞');
        renderFeatures(keyLevel);
        if (keyData.expiry) {
          expiryInterval = setInterval(function() {
            var d2 = getDaysLeft(keyData.expiry);
            document.getElementById('expiryDisplay').textContent = d2;
            document.getElementById('keyExpiryDisplay').textContent = '🔑 Còn: ' + d2;
            if (d2 === 'ĐÃ HẾT HẠN') { clearInterval(expiryInterval); handleLogout(); }
          }, 1000);
        }
        checkInterval = setInterval(checkKeyPeriodic, 5000);
        showToast('✅ Chào mừng trở lại!');
      } else {
        SecureStore.del('key');
      }
    });
  }

  document.getElementById('loginBtnFull').addEventListener('click', handleLogin);
  document.getElementById('keyInput').addEventListener('keypress', function(e){ if (e.key === 'Enter') handleLogin(); });

  document.querySelectorAll('.ff-btn').forEach(function(btn) {
    btn.addEventListener('click', function() {
      document.querySelectorAll('.ff-btn').forEach(function(b){ b.classList.remove('active'); });
      this.classList.add('active');
    });
  });
  document.getElementById('activateBtn').addEventListener('click', activateAndOpen);

  document.addEventListener('click', function(e) {
    var sw = e.target.closest('.switch:not(.locked)');
    if (!sw || !_integrityOK) return;
    if (!isLoggedIn) { showToast('Chưa đăng nhập!'); return; }
    var feature = sw.dataset.feature;
    if (!feature) return;
    sw.classList.toggle('active');
    var state = sw.classList.contains('active');
    SecureStore.set('t_' + feature, state);
    Bridge.call(feature, { enabled: state, nonce: sessionNonce });
    var name = sw.closest('.feature-item').querySelector('.info b').textContent || feature;
    showToast(state ? '✅ Đã bật ' + name : '⛔ Đã tắt ' + name);
    updateVipStats(currentKeyType);
  });

  document.getElementById('settingsNav').addEventListener('click', function() {
    if (confirm('Đăng xuất?')) handleLogout();
  });

  document.addEventListener('visibilitychange', function() {
    if (document.hidden) { sessionNonce = null; }
    else if (isLoggedIn) { sessionNonce = randomNonce(); }
  });
});
</script>
</body>
</html>
