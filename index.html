<!-- language: HTML/JS, file: index.html, target: browser, Firebase RTDB -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SENSI ULTRALOCK — CHECK KEY</title>
<style>
  *{box-sizing:border-box}
  html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#040404;color:#fff;overflow-x:hidden;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(circle at 50% -18%,rgba(255,210,0,.12),transparent 36%),linear-gradient(180deg,#090909 0%,#020202 100%);display:grid;place-items:center;padding:18px}
  .card{width:min(440px,92vw);padding:28px;border:1px solid rgba(255,255,255,.10);border-radius:32px;background:rgba(10,10,10,.88);box-shadow:0 26px 70px rgba(0,0,0,.62);text-align:center}
  .logo{width:180px;height:180px;object-fit:contain;border-radius:22px;filter:drop-shadow(0 0 22px rgba(255,211,0,.30))}
  h1{font-size:34px;letter-spacing:.9px;margin:10px 0}
  h1 span{color:#facc15}
  .byline{color:#facc15;font-weight:900;letter-spacing:1px;margin-bottom:18px}
  .platform-badge{background:rgba(59,130,246,.2);color:#60a5fa;border:1px solid rgba(59,130,246,.3);padding:5px 16px;border-radius:999px;font-size:13px;font-weight:900;display:inline-block;margin-bottom:12px}
  .input-row{height:60px;display:grid;grid-template-columns:36px 1fr;gap:6px;align-items:center;border:1px solid rgba(255,255,255,.14);background:rgba(18,18,18,.92);border-radius:20px;padding:0 15px;margin:8px 0}
  .input-row input{width:100%;height:100%;border:0;background:transparent;color:#fff;font-size:18px;outline:none;-webkit-appearance:none}
  .btn{width:100%;height:60px;margin-top:15px;border:0;border-radius:20px;color:#0b0b0b;font-size:19px;font-weight:950;background:linear-gradient(135deg,#ffe55a,#f4b400);cursor:pointer;-webkit-tap-highlight-color:transparent}
  .btn:disabled{opacity:.4;cursor:not-allowed}
  .msg{min-height:24px;margin:10px 0;text-align:center;font-size:14px}
  .msg.err{color:#fecaca}
  .msg.ok{color:#bbf7d0}
  .msg.load{color:#facc15}
  .toast{position:fixed;left:50%;bottom:40px;z-index:90;transform:translate(-50%,20px);opacity:0;padding:12px 16px;border-radius:999px;background:rgba(18,18,18,.96);color:#e5e7eb;border:1px solid rgba(250,204,21,.20);transition:.25s;white-space:nowrap;pointer-events:none}
  .toast.active{opacity:1;transform:translate(-50%,0)}
  @media(max-width:430px){.logo{width:140px;height:140px}h1{font-size:28px}.card{padding:18px}}
</style>
</head>
<body>

<div class="card">
  <img class="logo" src="https://i.postimg.cc/pLj6h1mL/logo.png" alt="SENSI ULTRALOCK">
  <h1>SENSI <span>ULTRALOCK</span></h1>
  <div class="byline">VIP EDITION</div>
  <div class="platform-badge">🍎 iOS</div>

  <div class="input-row">
    <span style="font-size:20px;color:#facc15;">⌨</span>
    <input type="text" id="keyInput" placeholder="Nhập key iOS..." autocomplete="off" spellcheck="false">
  </div>

  <div class="msg" id="msg"></div>
  <button class="btn" id="loginBtn">CHECK KEY</button>

  <div style="margin-top:15px;font-size:13px;color:#9ca3af;">
    Liên hệ: <span style="color:#facc15;font-weight:900;cursor:pointer;"
    onclick="window.open('https://zalo.me/976457016','_blank')">0976457016</span>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
var FIREBASE_URL = "https://aimlock-key-default-rtdb.firebaseio.com";
var PLATFORM     = "ios";
var REDIRECT_URL = "https://your-main-app-url.example/script.html"; // <<< đổi thành web có script

// ============================================================
// DEVICE ID — cố định theo máy
// ============================================================
var deviceId = localStorage.getItem("HEADLOCK_DEVICE_ID");
if (!deviceId) {
  deviceId = "IOS-" + Date.now() + "-" + Math.random().toString(36).substr(2, 6);
  localStorage.setItem("HEADLOCK_DEVICE_ID", deviceId);
}

// ============================================================
// iOS VERSION GUARD
// ============================================================
function getIOSVersion() {
  var m = navigator.userAgent.match(/OS (\d+)_(\d+)/);
  return m ? parseInt(m[1]) : 0;
}
var iosVersion = getIOSVersion();
var isBlocked  = iosVersion === 27;

// ============================================================
// TOAST
// ============================================================
function showToast(m) {
  var t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('active');
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.classList.remove('active'); }, 2500);
}

// ============================================================
// KEY VALIDATION (mirror logic app chính)
// ============================================================
async function validateKey(key) {
  try {
    var res = await fetch(FIREBASE_URL + "/keys/" + encodeURIComponent(key) + ".json");
    if (!res.ok) return { success: false, message: "Lỗi kết nối Firebase!" };
    var data = await res.json();
    if (!data) return { success: false, message: "Key không tồn tại!" };

    if (isBlocked) return { success: false, message: "iOS 27 không được hỗ trợ!" };

    if (data.platform && data.platform !== PLATFORM && data.platform !== 'both') {
      return { success: false, message: "Key dành cho " + String(data.platform).toUpperCase() + ", không dùng cho iOS!" };
    }

    var now = Date.now();
    if (data.expiry && data.expiry < now) {
      return { success: false, message: "Key đã hết hạn!", expired: true };
    }

    if (data.deviceLimit) {
      var devices = data.devices || [];
      if (devices.length >= data.deviceLimit && devices.indexOf(deviceId) === -1) {
        return { success: false, message: "Giới hạn thiết bị đã đạt!" };
      }
    }

    // bind device nếu chưa có
    var list = data.devices || [];
    if (list.indexOf(deviceId) === -1) {
      list.push(deviceId);
      await fetch(FIREBASE_URL + "/keys/" + encodeURIComponent(key) + "/devices.json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(list)
      });
      data.devices = list;
    }

    return { success: true, data: data };
  } catch (e) {
    return { success: false, message: "Không kết nối được Firebase!" };
  }
}

// ============================================================
// HANDLE LOGIN → REDIRECT
// ============================================================
async function handleCheck() {
  var input = document.getElementById('keyInput');
  var key   = input.value.trim();
  var msg   = document.getElementById('msg');
  var btn   = document.getElementById('loginBtn');

  if (!key) { showToast("Nhập key iOS!"); return; }

  if (isBlocked) {
    msg.textContent = "❌ iOS 27 không được hỗ trợ!";
    msg.className = "msg err";
    showToast("❌ iOS 27 không được hỗ trợ!");
    return;
  }

  msg.textContent = "⏳ Đang kiểm tra key...";
  msg.className = "msg load";
  btn.disabled = true;

  var result = await validateKey(key);

  if (!result.success) {
    msg.textContent = "❌ " + result.message;
    msg.className = "msg err";
    showToast("❌ " + result.message);
    btn.disabled = false;
    // Ở LẠI — không chuyển hướng
    return;
  }

  // HỢP LỆ → lưu key rồi redirect sang web script
  localStorage.setItem("HEADLOCK_KEY", key);
  localStorage.setItem("HEADLOCK_KEYDATA", JSON.stringify(result.data));

  msg.textContent = "✅ Key hợp lệ! Đang chuyển hướng...";
  msg.className = "msg ok";
  showToast("✅ Key hợp lệ! Đang mở app...");

  setTimeout(function () {
    // giữ nguyên key qua query string để app đích khỏi fetch lại
    var url = REDIRECT_URL + (REDIRECT_URL.indexOf('?') === -1 ? '?' : '&')
            + "key=" + encodeURIComponent(key);
    window.location.href = url;
  }, 800);
}

// ============================================================
// EVENTS
// ============================================================
document.addEventListener('DOMContentLoaded', function () {
  var btn = document.getElementById('loginBtn');
  var inp = document.getElementById('keyInput');

  btn.addEventListener('click', handleCheck);
  inp.addEventListener('keypress', function (e) {
    if (e.key === 'Enter') handleCheck();
  });

  if (isBlocked) {
    btn.disabled = true;
    inp.disabled = true;
    document.getElementById('msg').textContent = "⚠️ iOS 27 không được hỗ trợ!";
    document.getElementById('msg').className = "msg err";
    showToast("⚠️ iOS 27 không được hỗ trợ!");
  }
});
</script>
</body>
</html>
