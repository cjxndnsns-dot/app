<!-- language: HTML/JS, file: index.html, target: browser + deep link -->
<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>SENSI ULTRALOCK — KÍCH HOẠT KEY</title>
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:#050505;color:#fff;-webkit-tap-highlight-color:transparent}
  body{background:radial-gradient(circle at 50% 0%,rgba(250,204,21,.10),transparent 40%),linear-gradient(180deg,#0a0a0a,#020202);display:grid;place-items:center;padding:20px}

  .card{width:min(420px,94vw);padding:32px 26px;border:1px solid rgba(255,255,255,.08);border-radius:26px;background:rgba(12,12,12,.9);box-shadow:0 24px 60px rgba(0,0,0,.6);text-align:center}
  .logo{width:96px;height:96px;object-fit:contain;border-radius:20px;margin:0 auto 16px;display:block;filter:drop-shadow(0 0 18px rgba(250,204,21,.35))}
  h1{font-size:24px;font-weight:950;letter-spacing:1.5px;margin-bottom:6px}
  h1 span{color:#facc15}
  .sub{color:#9ca3af;font-size:13px;font-weight:700;margin-bottom:24px}

  .input-wrap{margin-bottom:14px}
  .input-wrap input{width:100%;height:54px;border:1px solid rgba(255,255,255,.12);border-radius:14px;background:rgba(20,20,20,.9);color:#fff;font-size:16px;padding:0 16px;outline:none;font-family:inherit;-webkit-appearance:none}
  .input-wrap input:focus{border-color:rgba(250,204,21,.5)}
  .input-wrap input::placeholder{color:#5a5a5a}

  .btn{width:100%;height:54px;border:0;border-radius:14px;color:#0b0b0b;font-size:17px;font-weight:950;letter-spacing:.5px;background:linear-gradient(135deg,#ffe55a,#f4b400);cursor:pointer;font-family:inherit;transition:.2s}
  .btn:active{transform:scale(.98)}
  .btn:disabled{opacity:.45;cursor:not-allowed}

  .msg{min-height:20px;margin:12px 0 0;font-size:13px;font-weight:800;text-align:center}
  .msg.err{color:#fca5a5}
  .msg.ok{color:#86efac}
  .msg.load{color:#facc15}

  .footer{margin-top:24px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);font-size:13px;color:#9ca3af;font-weight:700}
  .footer a{color:#facc15;text-decoration:none;font-weight:950}

  .toast{position:fixed;left:50%;bottom:34px;transform:translate(-50%,20px);opacity:0;padding:11px 18px;border-radius:999px;background:rgba(18,18,18,.96);color:#e5e7eb;border:1px solid rgba(250,204,21,.2);font-size:13px;font-weight:800;transition:.25s;pointer-events:none;white-space:nowrap}
  .toast.active{opacity:1;transform:translate(-50%,0)}

  @media(max-width:430px){.card{padding:26px 20px}.logo{width:80px;height:80px}h1{font-size:20px}}
</style>
</head>
<body>

<div class="card">
  <img class="logo" src="https://i.postimg.cc/pLj6h1mL/logo.png" alt="SENSI ULTRALOCK">
  <h1>SENSI <span>ULTRALOCK</span></h1>
  <div class="sub">Nhập key để sử dụng SENSI ULTRALOCK</div>

  <div class="input-wrap">
    <input type="text" id="keyInput" placeholder="Nhập key iOS..." autocomplete="off" spellcheck="false">
  </div>

  <button class="btn" id="checkBtn">KÍCH HOẠT</button>
  <div class="msg" id="msg"></div>

  <div class="footer">
    Chưa có key? Liên hệ <a href="https://zalo.me/976457016" target="_blank">Zalo</a>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// ============================================================
// CONFIG
// ============================================================
var FIREBASE_URL = "https://aimlock-key-default-rtdb.firebaseio.com";
var PLATFORM     = "ios";

// Scheme app SENSI ULTRALOCK. Đổi thành scheme thật của app chief.
// App native của chief phải đăng ký scheme này trong Info.plist (CFBundleURLSchemes).
var APP_SCHEME   = "sensiultralock://";

// Fallback khi app chưa cài trên máy
var FALLBACK_URL = "https://zalo.me/976457016";

// ============================================================
// DEVICE ID
// ============================================================
var deviceId = localStorage.getItem("SENSI_DEVICE_ID");
if (!deviceId) {
  deviceId = "IOS-" + Date.now() + "-" + Math.random().toString(36).slice(2, 8);
  localStorage.setItem("SENSI_DEVICE_ID", deviceId);
}

// ============================================================
// TOAST
// ============================================================
function toast(m) {
  var t = document.getElementById('toast');
  t.textContent = m;
  t.classList.add('active');
  clearTimeout(window._tt);
  window._tt = setTimeout(function(){ t.classList.remove('active'); }, 2400);
}

// ============================================================
// iOS VERSION GUARD
// ============================================================
function iosVer() {
  var m = navigator.userAgent.match(/OS (\d+)_/);
  return m ? parseInt(m[1]) : 0;
}
var blocked = iosVer() === 27;

// ============================================================
// VALIDATE KEY
// ============================================================
async function checkKey(key) {
  try {
    var res = await fetch(FIREBASE_URL + "/keys/" + encodeURIComponent(key) + ".json");
    if (!res.ok) return { ok: false, msg: "Lỗi kết nối!" };
    var data = await res.json();
    if (!data) return { ok: false, msg: "Key không tồn tại!" };

    if (blocked) return { ok: false, msg: "iOS 27 không được hỗ trợ!" };

    if (data.platform && data.platform !== PLATFORM && data.platform !== "both") {
      return { ok: false, msg: "Key dành cho " + String(data.platform).toUpperCase() + "!" };
    }

    if (data.expiry && data.expiry < Date.now()) {
      return { ok: false, msg: "Key đã hết hạn!" };
    }

    var devices = data.devices || [];
    if (data.deviceLimit && devices.length >= data.deviceLimit && devices.indexOf(deviceId) === -1) {
      return { ok: false, msg: "Giới hạn thiết bị!" };
    }

    if (devices.indexOf(deviceId) === -1) {
      devices.push(deviceId);
      await fetch(FIREBASE_URL + "/keys/" + encodeURIComponent(key) + "/devices.json", {
        method: "PUT",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify(devices)
      });
      data.devices = devices;
    }

    return { ok: true, data: data };
  } catch (e) {
    return { ok: false, msg: "Không kết nối được server!" };
  }
}

// ============================================================
// OPEN SENSI ULTRALOCK — deep link với fallback
// ============================================================
function openSensiApp(key) {
  // truyền key vào scheme để app native nhận qua openURL
  var url = APP_SCHEME + (APP_SCHEME.indexOf('?') === -1 ? '?' : '&')
          + "key=" + encodeURIComponent(key);

  var t0 = Date.now();

  // iOS Safari: iframe + location.href combo là cách bền nhất
  var iframe = document.createElement('iframe');
  iframe.style.display = 'none';
  iframe.src = url;
  document.body.appendChild(iframe);
  window.location.href = url;

  // nếu sau 1.5s vẫn còn trên trang → app chưa cài, đẩy fallback
  setTimeout(function () {
    if (iframe.parentNode) iframe.parentNode.removeChild(iframe);
    if (Date.now() - t0 < 2200 && !document.hidden && FALLBACK_URL) {
      window.location.href = FALLBACK_URL;
    }
  }, 1500);
}

// ============================================================
// HANDLE
// ============================================================
async function handleActivate() {
  var input = document.getElementById('keyInput');
  var msg   = document.getElementById('msg');
  var btn   = document.getElementById('checkBtn');
  var key   = input.value.trim();

  if (!key) { toast("Nhập key!"); return; }

  if (blocked) {
    msg.textContent = "iOS 27 không được hỗ trợ!";
    msg.className = "msg err";
    toast("iOS 27 không được hỗ trợ!");
    return;
  }

  msg.textContent = "Đang kiểm tra...";
  msg.className = "msg load";
  btn.disabled = true;

  var r = await checkKey(key);

  if (!r.ok) {
    msg.textContent = r.msg;
    msg.className = "msg err";
    toast(r.msg);
    btn.disabled = false;
    return; // Ở LẠI
  }

  // HỢP LỆ → lưu key rồi mở app
  localStorage.setItem("SENSI_KEY", key);
  localStorage.setItem("SENSI_KEYDATA", JSON.stringify(r.data));

  msg.textContent = "Key hợp lệ! Đang mở SENSI ULTRALOCK...";
  msg.className = "msg ok";
  toast("Key hợp lệ!");

  setTimeout(function () { openSensiApp(key); }, 600);
}

// ============================================================
// EVENTS
// ============================================================
document.addEventListener('DOMContentLoaded', function () {
  document.getElementById('checkBtn').addEventListener('click', handleActivate);
  document.getElementById('keyInput').addEventListener('keypress', function (e) {
    if (e.key === 'Enter') handleActivate();
  });

  if (blocked) {
    document.getElementById('checkBtn').disabled = true;
    document.getElementById('keyInput').disabled = true;
    document.getElementById('msg').textContent = "iOS 27 không được hỗ trợ!";
    document.getElementById('msg').className = "msg err";
  }
});
</script>
</body>
</html>
